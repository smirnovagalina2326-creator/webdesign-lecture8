<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тарифи хмарного сервісу (Bootstrap)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body class="bg-light py-5">

    <div class="container">
        <h1 class="text-center mb-5">Тарифи хмарного сервісу (Bootstrap)</h1>
        
        <div class="row g-4">
            <!-- Картка 1 -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body d-flex flex-column">
                        <h3 class="card-title">Базовий</h3>
                        <p class="card-text">Ідеально для старту невеликих проєктів та особистих потреб.</p>
                        <h4 class="text-primary mb-3">$9 / міс</h4>
                        <button class="btn btn-primary mt-auto">Обрати тариф</button>
                    </div>
                </div>
            </div>

            <!-- Картка 2 -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm border-primary">
                    <div class="card-body d-flex flex-column">
                        <h3 class="card-title">Професійний</h3>
                        <p class="card-text">Для зростаючих бізнесів із розширеними вимогами до ресурсів.</p>
                        <h4 class="text-primary mb-3">$29 / міс</h4>
                        <button class="btn btn-primary mt-auto">Обрати тариф</button>
                    </div>
                </div>
            </div>

            <!-- Картка 3 -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body d-flex flex-column">
                        <h3 class="card-title">Корпоративний</h3>
                        <p class="card-text">Максимальна продуктивність, безпека та підтримка 24/7.</p>
                        <h4 class="text-primary mb-3">$99 / міс</h4>
                        <button class="btn btn-primary mt-auto">Обрати тариф</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
